name: Build NexaPilot Mobile APK

on:
  push:
    branches: ["main"]
    paths:
      - "android-agent/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true

      - name: Install SDK packages
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        working-directory: android-agent
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp android-agent/app/build/outputs/apk/debug/app-debug.apk NexaPilot-Mobile-v0.5.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexaPilot-Mobile-v0.5.0
          path: NexaPilot-Mobile-v0.5.0.apk
          if-no-files-found: error
